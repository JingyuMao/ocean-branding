<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expanding Cards</title>
<style>
html,body{
    margin:0;
    padding:0;
}
.exp-cards-wrapper,
.exp-cards-wrapper *{
    box-sizing:border-box;
}
.exp-cards-wrapper{
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    padding:0;
}
.exp-cards{
    width:100%;
    max-width:1400px;
    height:500px;
    display:flex;
    gap:20px;
    margin:0;
    padding:0;
    list-style:none;
}
.exp-card{
    position:relative;
    flex:1;
    overflow:hidden;
    border-radius:6px;
    cursor:pointer;
    transition:flex .6s cubic-bezier(.16,1,.3,1), height .6s cubic-bezier(.16,1,.3,1);
    background-size:cover;
    background-position:center;
}
.exp-card.active{
    flex:3;
}
.exp-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.75) 0%,
        rgba(0,0,0,.45) 45%,
        rgba(0,0,0,.1) 100%
    );
}
.exp-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:flex-start;
    text-align:left;
    padding:30px;
    color:#fff;
    z-index:2;
}
.exp-content h2{
    width:100%;
    font-size:28px;
    font-weight:600;
    line-height:1.2;
    margin:0;
    transition:font-size .45s cubic-bezier(.65,0,.35,1);
}
.exp-card.active h2{
    transition:font-size .5s cubic-bezier(.16,1,.3,1);
}
.exp-card:not(.active) .exp-content{
    justify-content:flex-end;
    align-items:flex-start;
    text-align:left;
}
.exp-card:not(.active) h2{
    font-size:24px;
    width:100%;
}
.exp-text-reveal{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .5s cubic-bezier(.65,0,.35,1);
}
.exp-card.active .exp-text-reveal{
    grid-template-rows:1fr;
    transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1);
}
.exp-content p{
    width:520px;
    max-width:calc(100vw - 108px);
    min-height:0;
    margin:0;
    line-height:1.6;
    opacity:0;
    overflow:hidden;
    transform:translateY(15px);
    transition:
        margin-top .45s cubic-bezier(.65,0,.35,1),
        opacity .25s ease,
        transform .3s cubic-bezier(.4,0,1,1);
}
.exp-card.active p{
    margin-top:14px;
    opacity:1;
    transform:translateY(0);
    transition:
        margin-top .5s cubic-bezier(.16,1,.3,1),
        opacity .35s ease .15s,
        transform .4s cubic-bezier(.22,1,.36,1) .15s;
}
@media (max-width:900px){
.exp-cards-wrapper{
    padding:0;
}
.exp-cards{
    flex-direction:column;
    height:auto;
}
.exp-card{
    flex:none;
    height:120px;
}
.exp-card.active{
    flex:none;
    height:320px;
}
.exp-content{
    padding:24px;
}
.exp-content h2{
    font-size:24px;
}
.exp-content p{
    max-width:calc(100vw - 48px);
}
}
</style>
</head>
<body>

<div class="exp-cards-wrapper">
    <ul class="exp-cards" id="expCards"></ul>
</div>

<script>
const cardsData = [
    {
        title: "The Most All-Inclusive Cruises in Ultra-Luxury",
        text: "Combining the best-in-class discovery capability with ultra-luxury and an unrivalled choice of included dining, premium beverages, wellness experiences and enriching excursions, Scenic Discovery Yachts include so much more than any other cruise.",
        image: "https://res.cloudinary.com/dej1hvkk2/image/upload/v1775679394/samples/landscapes/girl-urban-view.jpg",
        active: true
    },
    {
        title: "Europe",
        text: "Cruise through charming rivers, medieval villages, and historic capitals.",
        image: "https://res.cloudinary.com/dej1hvkk2/image/upload/v1775679394/samples/landscapes/girl-urban-view.jpg",
        active: false
    },
    {
        title: "Asia",
        text: "Discover vibrant cultures, ancient temples, and spectacular natural wonders.",
        image: "https://res.cloudinary.com/dej1hvkk2/image/upload/v1775679394/samples/landscapes/girl-urban-view.jpg",
        active: false
    },
];

function renderCards(data){
    const container = document.getElementById("expCards");
    container.innerHTML = data.map(card => `
        <li class="exp-card${card.active ? " active" : ""}" style="background-image:url('${card.image}')">
            <div class="exp-content">
                <h2>${card.title}</h2>
                <div class="exp-text-reveal"><p>${card.text}</p></div>
            </div>
        </li>
    `).join("");

    container.querySelectorAll(".exp-card").forEach(card => {
        card.addEventListener("click", () => {
            container.querySelectorAll(".exp-card").forEach(c => c.classList.remove("active"));
            card.classList.add("active");
        });
    });
}

renderCards(cardsData);
</script>
</body>
</html>
